<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}auth-from-scratch{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="top-bar">
    <div class="brand {{ brand_kind|default('app') }}">
      <div class="mark">{{ brand_mark|default('L') }}</div>
      {{ brand_name|default('Lighthouse Notes') }}
    </div>
    <div class="tag">{% block tag %}part of auth-from-scratch{% endblock %}</div>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    auth-from-scratch — an educational, non-production simulation of an SSO login.
  </footer>
  <script src="{{ url_for('static', filename='js/trace.js') }}"></script>
</body>
</html>
